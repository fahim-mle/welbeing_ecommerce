name: CI

on:
  push:
    branches: [001-health-wellbeing-store, production]
  pull_request:
    branches: [001-health-wellbeing-store, production]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
        run: npx prisma migrate deploy

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          JWT_SECRET: test-secret
          NODE_ENV: test
        run: npm test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck || true

      - name: Run Lint
        run: npm run lint || true

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/001-health-wellbeing-store')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend
        run: |
          docker build -f src/backend/Dockerfile -t welbeing-backend:${{ github.sha }} .

      - name: Build Frontend
        run: |
          docker build -f src/frontend/Dockerfile -t welbeing-frontend:${{ github.sha }} .

      - name: Test Backend Image
        run: |
          docker run --rm welbeing-backend:${{ github.sha }} node --version

      - name: Test Frontend Image
        run: |
          docker run --rm welbeing-frontend:${{ github.sha }} nginx -v

  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/001-health-wellbeing-store'
    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} 'bash -s' < scripts/deploy.sh

      - name: Deployment Summary
        if: success()
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Site: http://welbeing.mindinroot.com"
          echo "📊 API Health: http://welbeing.mindinroot.com/api/health"
          echo ""
          echo "Note: All tests passed in CI before deployment."
          echo "Manual verification recommended after deployment."
