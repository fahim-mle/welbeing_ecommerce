name: Sync dev after merge

on:
  push:
    branches:
      - 001-health-wellbeing-store

jobs:
  sync:
    name: Merge main back into dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge 001-health-wellbeing-store into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git merge origin/001-health-wellbeing-store --no-edit
          git push origin dev
